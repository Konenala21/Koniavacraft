name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']  # tag 交給 publish.yml 處理
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build

      - name: Prepare artifact metadata
        id: artifact_meta
        shell: bash
        run: |
          ref_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          safe_ref_name="${ref_name//\//-}"
          echo "artifact_name=koniava-build-${safe_ref_name}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          path: build/libs/*.jar
          retention-days: 7
