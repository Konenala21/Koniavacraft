// ========== Changelog ??嚗??????摰嗥?畾菔嚗?=========
def extractChangelogSectionByHeader(String versionHeader, List<String> sectionTitles) {
    def changelogFile = file("CHANGELOG.md")
    if (!changelogFile.exists()) return ""
    def lines = changelogFile.readLines('UTF-8')
    def result = []
    def inVersion = false
    def capturing = false

    for (line in lines) {
        def trimmedLine = line.trim()
        if (trimmedLine.startsWith("## [")) {
            def isTargetVersion = trimmedLine.startsWith("## [${versionHeader}]")
            if (inVersion && !isTargetVersion) {
                break
            }
            inVersion = isTargetVersion
            capturing = false
            continue
        }

        if (!inVersion) {
            continue
        }

        if (trimmedLine.startsWith("### ")) {
            def currentHeader = trimmedLine.substring(4).trim()
            if (sectionTitles.any { it.equalsIgnoreCase(currentHeader) }) {
                capturing = true
                continue
            }
            if (capturing) {
                break
            }
        }

        if (capturing) {
            result.add(line)
        }
    }

    return result.join('\n').trim()
}

def extractChangelog(String version) {
    def playerHeaders = [
            "玩家版變更 / Player-facing Changelog",
            "Player Changes / 玩家更新內容",
            "Player Changes"
    ]

    def playerFacing = extractChangelogSectionByHeader(version, playerHeaders)
    if (playerFacing.trim().isEmpty()) {
        playerFacing = extractChangelogSectionByHeader("Unreleased", playerHeaders)
    }
    return playerFacing.trim()
}
// ========== Modrinth ==========
modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = "koniavacraft"
    versionNumber = mod_version
    versionType = "release"
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]

    // git hash 用 providers.exec()（execution time），避免 configuration-cache 禁止在
    // configuration phase 啟動外部程序的限制
    def playerContent = extractChangelog(mod_version)
    def gitHashProvider = providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
    }.standardOutput.asText.map { it.trim() }
    changelog = gitHashProvider.map { hash ->
        def header = "**v${mod_version}**" + (hash ? " | commit `${hash}`" : "")
        playerContent ? "${header}\n\n${playerContent}" : header
    }

    // Modrinth 頁面 body 的單一來源（英文，玩家向）。維護描述就改這個檔，發版自動同步。
    // 必須放在 repo 內（被 git 追蹤），否則 GitHub Actions checkout 讀不到 → 描述被清空。
    // 注意：不要改回 README.md，那是 GitHub 倉庫首頁（繁中、精簡、開發者向），用途不同。
    def modrinthBody = file("MODRINTH_BODY.md")
    syncBodyFrom = modrinthBody.exists() ? modrinthBody.text : ""
}

// ========== CurseForge ?澆? ==========
task publishToCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    upload(System.getenv("CURSEFORGE_PROJECT_ID") ?: "0", jar) {
        displayName = "${mod_name} v${mod_version} for MC ${minecraft_version}"
        releaseType = "beta"
        addGameVersion(minecraft_version)
        addModLoader("NeoForge")
        changelog = extractChangelog(mod_version)
        changelogType = "markdown"
    }
}
