plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.darkhax.curseforgegradle' version '1.1.+'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = "v${mod_version}-mc${minecraft_version} [NeoForge ${neo_version}]"
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()



    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // ???扯?芸?嚗溶??JVM ?
            jvmArgument '-Xmx4G'
            jvmArgument '-Xms2G'
            jvmArgument '-XX:+UseG1GC'
            jvmArgument '-XX:+ParallelRefProcEnabled'
            jvmArgument '-XX:MaxGCPauseMillis=200'
            jvmArgument '-XX:+UnlockExperimentalVMOptions'
            jvmArgument '-XX:+DisableExplicitGC'
            jvmArgument '-XX:G1NewSizePercent=30'
            jvmArgument '-XX:G1MaxNewSizePercent=40'
            jvmArgument '-XX:G1HeapRegionSize=8M'
            jvmArgument '-XX:G1ReservePercent=20'
            jvmArgument '-XX:G1HeapWastePercent=5'
            jvmArgument '-XX:G1MixedGCCountTarget=4'
            jvmArgument '-XX:InitiatingHeapOccupancyPercent=15'
            jvmArgument '-XX:G1MixedGCLiveThresholdPercent=90'
            jvmArgument '-XX:G1RSetUpdatingPauseTimePercent=5'
            jvmArgument '-XX:SurvivorRatio=32'
            jvmArgument '-XX:+PerfDisableSharedMem'
            jvmArgument '-XX:MaxTenuringThreshold=1'
        }

        client2 {
            client()
            gameDirectory = project.file('run2')
            programArguments.addAll '--username', 'Dev2'
            jvmArgument '-Xmx2G'
            jvmArgument '-Xms1G'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // ???扯?芸?嚗溶??JVM ?
            jvmArgument '-Xmx4G'
            jvmArgument '-Xms2G'
            jvmArgument '-XX:+UseG1GC'
            jvmArgument '-XX:+ParallelRefProcEnabled'
            jvmArgument '-XX:MaxGCPauseMillis=200'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty 'koniava.disableBiomeInjection', 'true'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            // ?? ?扯?內嚗迨璅?????5-10% CPU ?嚗???閰喟敦?酉?”靽⊥
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            // ?? ?扯?內嚗EBUG 蝝????10-20% CPU ?
            // ? 憒??閬憟賜??扯嚗隞交??org.slf4j.event.Level.INFO
            logLevel = org.slf4j.event.Level.DEBUG

            // Set the file encoding for the JVM to UTF-8
            systemProperty 'file.encoding', 'UTF-8'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // 霈?NeoForge GameTest ?臭誑敺?src/test/java ??皜祈岫憿
            sourceSet(sourceSets.test)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // Jade - optional compile-time, runtime for testing
    compileOnly("maven.modrinth:jade:${jade_version}")
    localRuntime("maven.modrinth:jade:${jade_version}")
    implementation "io.github.classgraph:classgraph:4.8.173"
    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // JUnit 5 Setup
    testImplementation(platform("org.junit:junit-bom:5.10.1"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.joml:joml:1.10.5")
    testImplementation("org.mockito:mockito-core:5.8.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.8.0")
    testImplementation sourceSets.main.output
}

test {
    useJUnitPlatform()
    // ?迂?桀?皜祈岫摮??憿??鞈?
    classpath += sourceSets.main.runtimeClasspath
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_logo               : mod_logo,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("syncGameTestStructures", Copy) {
    from("src/main/resources/data/${mod_id}/structure")
    include("**/*.nbt")
    into("run/gameteststructures")
}

// 生成 altar_area GameTest 模板（15×5×15 空白區域，石頭地板）
// altar 核心位置 (7,3,7)，柱底 y=1，柱頂 y=2 皆在地板上方
tasks.register("generateAltarTestStructure") {
    def outFile = file("run/gameteststructures/koniava/altar_area.nbt")
    outputs.file(outFile)
    onlyIf { !outFile.exists() }

    doLast {
        outFile.parentFile.mkdirs()

        def bos = new java.io.ByteArrayOutputStream()
        def gzip = new java.util.zip.GZIPOutputStream(bos)
        def dos = new java.io.DataOutputStream(gzip)

        // NBT helpers
        def writeString = { DataOutputStream s, String name, String val ->
            s.writeByte(8)                          // TAG_String
            s.writeShort(name.length()); s.writeBytes(name)
            byte[] vb = val.getBytes("UTF-8")
            s.writeShort(vb.length); s.write(vb)
        }
        def writeInt = { DataOutputStream s, String name, int val ->
            s.writeByte(3); s.writeShort(name.length()); s.writeBytes(name); s.writeInt(val)
        }

        // Root TAG_Compound (name length = 0)
        dos.writeByte(10); dos.writeShort(0)

        // DataVersion
        writeInt(dos, "DataVersion", 3953)

        // size: [15, 5, 15]
        dos.writeByte(9); dos.writeShort(4); dos.writeBytes("size")
        dos.writeByte(3); dos.writeInt(3)
        dos.writeInt(15); dos.writeInt(5); dos.writeInt(15)

        // palette: [{Name:"minecraft:stone"}, {Name:"minecraft:air"}]
        dos.writeByte(9); dos.writeShort(7); dos.writeBytes("palette")
        dos.writeByte(10); dos.writeInt(2)   // 2 compound entries
        // entry 0: stone
        writeString(dos, "Name", "minecraft:stone"); dos.writeByte(0)
        // entry 1: air
        writeString(dos, "Name", "minecraft:air");   dos.writeByte(0)

        // blocks: 225 stone blocks at y=0
        dos.writeByte(9); dos.writeShort(6); dos.writeBytes("blocks")
        dos.writeByte(10); dos.writeInt(225)
        for (int x = 0; x < 15; x++) {
            for (int z = 0; z < 15; z++) {
                // pos: [x, 0, z]
                dos.writeByte(9); dos.writeShort(3); dos.writeBytes("pos")
                dos.writeByte(3); dos.writeInt(3)
                dos.writeInt(x); dos.writeInt(0); dos.writeInt(z)
                // state: 0 (stone)
                writeInt(dos, "state", 0)
                dos.writeByte(0) // TAG_End
            }
        }

        // entities: []
        dos.writeByte(9); dos.writeShort(8); dos.writeBytes("entities")
        dos.writeByte(10); dos.writeInt(0)

        dos.writeByte(0) // TAG_End (root)
        dos.close()
        outFile.bytes = bos.toByteArray()
        println "Generated altar_area.nbt (15x5x15, stone floor)"
    }
}

tasks.named("runGameTestServer").configure {
    dependsOn("syncGameTestStructures")
    dependsOn("generateAltarTestStructure")
    dependsOn("testClasses")
}

