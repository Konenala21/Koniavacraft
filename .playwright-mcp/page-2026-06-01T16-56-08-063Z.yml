                  - generic [ref=e144]: 魔力
                  - text: ，
                - generic [ref=e145]:
                  - text: 其實是在
                  - generic [ref=e147]: 認識你自己
                  - text: 。
                - generic [ref=e150]: 帶上幻想去冒險，這是這個模組的核心精神。
                - generic [ref=e151]:
                  - text: （靈感致敬：
                  - generic [ref=e153]: 幻塔
                  - text: ）
                - separator [ref=e156]
