                - generic [ref=e122]:
                  - text: 大家好，我是
                  - generic [ref=e124]: Konenala21
                  - text: ，這是我第一個自製模組。
                - generic [ref=e125]: 它從一個問題長出來：
                - generic [ref=e126]:
                  - generic [ref=e128]: 魔法
                  - text: 如果不是神秘不可測的東西，而是一種能被
                  - generic [ref=e130]: 量化、研究、工業化
                  - text: 的
                  - generic [ref=e133]: 能源
                - generic [ref=e134]: ，世界會變成什麼樣子？
                - generic [ref=e135]: 於是有了研究系統，有了魔力工業，有了一整套機器與配方。
                - generic [ref=e136]: 每一台機器背後都有它的科學邏輯，每一條配方都來自對魔力的理解。
                - generic [ref=e137]:
                  - text: 但這只是
                  - generic [ref=e139]: 外殼
                  - text: 。
                - generic [ref=e140]:
                  - text: 越往外
                  - generic [ref=e142]: 探索
